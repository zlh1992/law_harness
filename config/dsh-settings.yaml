# 法务助手模式：Harness -> 本机 DS4F OpenAI-compatible API -> DeepSeek-V4-Flash
ui-onboarding:
  welcomeNoticeVersion: 2026-08-13.1
llm-pi-ai:
  providers:
    deepseek:
      displayName: Local DeepSeek DS4F
      api: openai-completions
      baseURL: http://127.0.0.1:8000/v1
      apiKeyEnv: DS4_API_KEY
      streamIdleTimeoutMs: 120000
      compat:
        thinkingFormat: openai
        supportsReasoningEffort: true
      retryPolicy:
        mode: normal
        maxRetries: 1
        backoff:
          initialDelayMs: 500
          maxDelayMs: 2000
          jitterRatio: 0.1
      models:
        - id: deepseek-v4-flash
          name: DeepSeek V4 Flash · Local DS4F
          contextWindow: 393216
          maxTokens: 8192
          input:
            - text
          reasoningEfforts:
            high: high
            max: max
agent-default-model:
  provider: deepseek
  model: deepseek-v4-flash
  reasoningEffort: high
